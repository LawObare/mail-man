<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox Categorizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Auth Section -->
    <div class="auth-section">
      <div class="auth-card">
        <h2>🔐 Gmail Access Required</h2>
        <p>Sign in to your Google Account to categorize your live inbox with SVD.</p>
        <button id="signInBtn" class="btn-primary">
          <span class="google-icon">G</span>
          Sign in with Gmail
        </button>
        <div id="status" class="status-text">Ready</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" style="display:none">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <h2>📬 Inbox SVD</h2>
          <span class="live-badge">LIVE</span>
        </div>
        
        <nav class="category-nav">
          <div class="category-item active" data-category="All">
            <span class="dot dot-all"></span>
            All Emails
            <span class="count">0</span>
          </div>
          <div class="category-item" data-category="Education">
            <span class="dot dot-education"></span>
            Education
            <span class="count">0</span>
          </div>
          <div class="category-item" data-category="Work">
            <span class="dot dot-work"></span>
            Work
            <span class="count">0</span>
          </div>
          <div class="category-item" data-category="Finance">
            <span class="dot dot-finance"></span>
            Finance
            <span class="count">0</span>
          </div>
          <div class="category-item" data-category="Promotions">
            <span class="dot dot-promotions"></span>
            Promotions
            <span class="count">0</span>
          </div>
        </nav>
        
        <div class="custom-categories">
          <button id="addCategoryBtn" class="btn-add-category">
            ➕ Add Custom Category
          </button>
          <div id="customCategoryList"></div>
        </div>
        
        <div class="sidebar-footer">
          <span class="math-badge">50D SVD • Vector Space</span>
        </div>
      </div>

      <!-- Main Panel -->
      <div class="main-panel">
        <div class="panel-header">
          <h3 id="panelTitle">All Emails</h3>
          <span id="emailCount" class="email-count">0 emails</span>
        </div>
        
        <div id="emailList" class="email-list">
          <div class="empty-state">Sign in to see your emails</div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
